name: "Build & Push to Registry"
description: "Build and push Docker images to any container registry with tags, GitHub Actions cache, build args, and multi-arch support."
author: "RelyBytes"

branding:
  icon: "package"
  color: "blue"

inputs:
  registry:
    description: "Container registry host, for example ghcr.io, docker.io, registry.example.com. Defaults to ghcr.io."
    required: false
    default: "ghcr.io"

  username:
    description: "Registry username. Defaults to the GitHub actor, works with ghcr.io."
    required: false
    default: "${{ github.actor }}"

  password:
    description: "Registry password or access token. Defaults to GITHUB_TOKEN, works with ghcr.io when packages: write is granted."
    required: false
    default: "${{ github.token }}"

  image_name:
    description: "Base image name, without tag and without registry host. Defaults to the current repository, lowercased. The environment suffix is appended to it."
    required: false
    default: ""

  dockerfile:
    description: "Path to the Dockerfile. Can be relative to the repository root or to the build context."
    required: false
    default: "Dockerfile"

  context:
    description: "Build context directory."
    required: false
    default: "."

  suffix:
    description: "Image-name suffix override, appended as '-{suffix}'. If empty, derived from the branch. Pass 'none' to disable the suffix."
    required: false
    default: ""

  version:
    description: "Override the tag, the part after ':'. If empty, 'YYYY-MM-DD.shortsha' is generated."
    required: false
    default: ""

  platforms:
    description: "Target platforms, comma-separated. Any platform other than the runner architecture needs QEMU binfmt registered on the host, see setup_qemu."
    required: false
    default: "linux/amd64"

  build_args:
    description: "Newline-separated build arguments, KEY=VALUE. Values are handed to buildx through the environment, never on the command line, but they are still recorded in the image config, so they are not a place for secrets."
    required: false
    default: ""

  target:
    description: "Target build stage for multi-stage Dockerfiles."
    required: false
    default: ""

  labels:
    description: "Newline-separated OCI labels, KEY=VALUE. Auto-generated when empty."
    required: false
    default: ""

  push:
    description: "Push the image to the registry. Must be 'true' or 'false'."
    required: false
    default: "true"

  push_on_pr:
    description: "Allow pushing images on pull request events. Disabled by default for safety. Must be 'true' or 'false'."
    required: false
    default: "false"

  additional_tags:
    description: "Comma-separated additional tags to publish on the same image."
    required: false
    default: ""

  latest:
    description: "Also publish the ':latest' tag on the suffixed image. Must be 'true', 'false', or 'auto'. 'auto' enables it on main/master non-PR builds only."
    required: false
    default: "auto"

  cache:
    description: "Import and export the GitHub Actions build cache. The action reads the cache service address from the runner itself; the cache is skipped, with a notice, where the runner provides none. Must be 'true' or 'false'."
    required: false
    default: "true"

  no_cache:
    description: "Disable the build cache entirely. Must be 'true' or 'false'."
    required: false
    default: "false"

  load:
    description: "Load the built image into the local Docker daemon when it is not pushed. 'auto' keeps the historical behaviour and loads single-platform builds only, 'false' never loads, 'true' always loads and is refused for multi-platform builds."
    required: false
    default: "auto"

  setup_qemu:
    description: "Register QEMU binfmt handlers before building. Off by default because binfmt registration is host-wide state that every other job on a shared runner sees."
    required: false
    default: "false"

outputs:
  image:
    description: "Full image reference, registry/name-suffix:version."
    value: ${{ steps.build.outputs.image }}

  image_repository:
    description: "Image repository portion, registry/name-suffix."
    value: ${{ steps.resolve.outputs.image_repository }}

  version:
    description: "Resolved tag, YYYY-MM-DD.shortsha or override."
    value: ${{ steps.resolve.outputs.version }}

  suffix:
    description: "Resolved environment suffix."
    value: ${{ steps.resolve.outputs.suffix }}

  branch:
    description: "Branch used to derive the suffix."
    value: ${{ steps.resolve.outputs.branch }}

  tags:
    description: "All tags applied, newline-separated."
    value: ${{ steps.build.outputs.tags }}

  digest:
    description: "Image digest after push, when available."
    value: ${{ steps.build.outputs.digest }}

  build_time:
    description: "UTC timestamp of the build."
    value: ${{ steps.build.outputs.build_time }}

runs:
  using: "composite"
  steps:
    - name: Check prerequisites and prepare an isolated Docker configuration
      id: prepare
      shell: bash
      env:
        REG_PASS: ${{ inputs.password }}
      run: |
        set -euo pipefail

        # SC1091: the path is only known at run time, shellcheck cannot follow it.
        # shellcheck source=scripts/lib.sh disable=SC1091
        source "$GITHUB_ACTION_PATH/scripts/lib.sh"

        echo "::group::Checking prerequisites"

        # Name what is missing here. A hosted runner has all of this
        # preinstalled; a self-hosted one may have an old Docker without the
        # buildx plugin, and the failure without this check comes much later and
        # says nothing useful.
        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::The 'docker' CLI is not on PATH. Install Docker on this runner, or use a runner that has it."
          exit 1
        fi

        if ! docker version --format '{{.Server.Version}}' >/dev/null 2>&1; then
          echo "::error::The Docker daemon is not reachable for user '$(id -un 2>/dev/null || echo unknown)'. Start Docker on this runner, or add the runner user to the docker group. This action never uses sudo."
          exit 1
        fi

        if ! docker buildx version >/dev/null 2>&1; then
          echo "::error::The 'docker buildx' plugin is not available. This action builds with BuildKit and cannot fall back to the legacy builder. Install the buildx plugin, or upgrade Docker to a version that ships it."
          exit 1
        fi

        echo "Docker server:   $(docker version --format '{{.Server.Version}}' 2>/dev/null)"
        echo "Buildx:          $(docker buildx version 2>/dev/null | head -n 1)"
        echo "Runner arch:     $(uname -m) ($(uname -s))"
        echo "Runner user:     $(id -un 2>/dev/null || echo unknown)"

        echo "::endgroup::"

        echo "::group::Preparing an isolated Docker configuration"

        # The runner masks the secrets it handed out itself, but a caller that
        # derives the password from a previous step output, which is how ECR
        # works, gets no masking at all. Mask it before any step can echo it.
        if [[ -n "$REG_PASS" ]]; then
          echo "::add-mask::$REG_PASS"
        fi

        # Self-hosted runners execute jobs from different repositories as the
        # same user, so ~/.docker/config.json is shared mutable state: logging
        # in writes a credential every concurrent job can read, and logging out
        # deletes the credential another job may be using mid-push. Give this
        # run its own DOCKER_CONFIG, with a unique name, mode 700, under the
        # per-job temp directory that the runner wipes between jobs. Buildx
        # keeps its builder metadata there too, so the current-builder marker
        # stops being shared as well. Nothing here is machine-wide and nothing
        # needs sudo.
        TEMP_BASE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        if [[ ! -d "$TEMP_BASE" ]]; then
          mkdir -p "$TEMP_BASE"
        fi

        CONFIG_DIR="$(mktemp -d "${TEMP_BASE%/}/docker-config-XXXXXXXXXX")"
        chmod 700 "$CONFIG_DIR"

        echo "DOCKER_CONFIG=$CONFIG_DIR" >>"$GITHUB_ENV"

        set_output "docker_config" "$CONFIG_DIR"
        set_output "docker_config_previous" "${DOCKER_CONFIG:-}"

        echo "Docker config:   $CONFIG_DIR"

        if [[ -z "${RUNNER_TEMP:-}" ]]; then
          echo "::warning::RUNNER_TEMP is not set, falling back to ${TEMP_BASE}. On a shared runner that directory is not wiped between jobs, so a hard-cancelled job could leave the registry credential on disk until the next cleanup."
        fi

        echo "::endgroup::"

    - name: Resolve image, version and push policy
      id: resolve
      shell: bash
      env:
        INPUT_SUFFIX: ${{ inputs.suffix }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        INPUT_LATEST: ${{ inputs.latest }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_PUSH_ON_PR: ${{ inputs.push_on_pr }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_NO_CACHE: ${{ inputs.no_cache }}
        INPUT_LOAD: ${{ inputs.load }}
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # SC1091: the path is only known at run time, shellcheck cannot follow it.
        # shellcheck source=scripts/lib.sh disable=SC1091
        source "$GITHUB_ACTION_PATH/scripts/lib.sh"

        echo "::group::Resolving image, version and push policy"

        # Validate every boolean and enumerated input up front. An unrecognised
        # value used to be indistinguishable from the default, so push: "yes"
        # quietly meant "do not push" and latest: "1" quietly meant "auto".
        PUSH_REQUESTED="$(require_boolean "push" "$INPUT_PUSH")"
        PUSH_ON_PR="$(require_boolean "push_on_pr" "$INPUT_PUSH_ON_PR")"
        CACHE_ENABLED="$(require_boolean "cache" "$INPUT_CACHE")"
        NO_CACHE="$(require_boolean "no_cache" "$INPUT_NO_CACHE")"
        LATEST_MODE="$(require_enum "latest" "$INPUT_LATEST" "true" "false" "auto")"
        LOAD_MODE="$(require_enum "load" "$INPUT_LOAD" "true" "false" "auto")"

        # The GitHub Actions cache backend is in use unless either switch turns
        # it off. Decided once here, because it also gates the step that reads
        # the cache service address from the runner.
        GHA_CACHE="false"
        if [[ "$CACHE_ENABLED" == "true" && "$NO_CACHE" != "true" ]]; then
          GHA_CACHE="true"
        fi

        IS_PULL_REQUEST="false"
        if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
          IS_PULL_REQUEST="true"
        fi

        # On pull request events github.sha is the ephemeral merge commit, which
        # does not exist in the repository, so an image tagged with it could not
        # be traced back to any commit. Use the head commit of the pull request.
        BUILD_SHA="$SHA"
        if [[ "$IS_PULL_REQUEST" == "true" && -n "$PR_HEAD_SHA" ]]; then
          BUILD_SHA="$PR_HEAD_SHA"
        fi

        if [[ -n "$INPUT_IMAGE_NAME" ]]; then
          assert_no_registry_host "$INPUT_IMAGE_NAME"
          BASE_NAME="$(sanitize_repository_path "$INPUT_IMAGE_NAME")"
        else
          BASE_NAME="$(sanitize_repository_path "$REPO")"
        fi

        if [[ -z "$BASE_NAME" ]]; then
          echo "::error::Image name is empty after sanitization. Pass a usable value in 'image_name'."
          exit 1
        fi

        if [[ "$IS_PULL_REQUEST" == "true" ]]; then
          BRANCH="$HEAD_REF"
        else
          BRANCH="$REF_NAME"
        fi

        if [[ -z "$BRANCH" ]]; then
          BRANCH="unknown"
        fi

        SUFFIX_INPUT="$(normalize "$INPUT_SUFFIX")"

        # Compare after trimming and lowercasing, otherwise 'None' and ' none '
        # fall through and produce a literal '-none' suffix.
        if [[ "$SUFFIX_INPUT" == "none" ]]; then
          SUFFIX=""
        elif [[ -n "$SUFFIX_INPUT" ]]; then
          SUFFIX="$(sanitize_name_component "$SUFFIX_INPUT")"
        elif [[ "$IS_PULL_REQUEST" == "true" ]]; then
          SUFFIX="$(sanitize_name_component "pr-${PR_NUMBER:-unknown}")"
        elif [[ "$REF_TYPE" == "tag" ]]; then
          SUFFIX="release"
        else
          case "$BRANCH" in
            main | master)
              SUFFIX="prod"
              ;;
            develop | dev)
              SUFFIX="dev"
              ;;
            staging)
              SUFFIX="staging"
              ;;
            release/*)
              SUFFIX="rc"
              ;;
            hotfix/*)
              SUFFIX="hotfix"
              ;;
            feature/*)
              SUFFIX="feat"
              ;;
            *)
              SUFFIX="$(sanitize_name_component "$BRANCH")"
              ;;
          esac
        fi

        if [[ -n "$SUFFIX" ]]; then
          IMAGE_NAME="${BASE_NAME}-${SUFFIX}"
        else
          IMAGE_NAME="$BASE_NAME"
        fi

        # Cap the repository name and check it against the registry grammar
        # before printing it. A name that only looks right produces an
        # 'invalid reference format' from the daemon long after the log has
        # confidently announced the image.
        IMAGE_NAME="$(cap_repository_name "$IMAGE_NAME")"
        assert_repository_name "$IMAGE_NAME"

        IMAGE_REPOSITORY="${REGISTRY}/${IMAGE_NAME}"

        if [[ -n "$INPUT_VERSION" ]]; then
          VERSION="$(sanitize_tag "$INPUT_VERSION")"
        else
          DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${BUILD_SHA:0:7}"
          VERSION="$(sanitize_tag "${DATE}.${SHORT_SHA}")"
        fi

        case "$LATEST_MODE" in
          true)
            LATEST_ENABLED="true"
            ;;
          false)
            LATEST_ENABLED="false"
            ;;
          *)
            if [[ "$IS_PULL_REQUEST" != "true" ]] && [[ "$BRANCH" =~ ^(main|master)$ ]]; then
              LATEST_ENABLED="true"
            else
              LATEST_ENABLED="false"
            fi
            ;;
        esac

        EFFECTIVE_PUSH="$PUSH_REQUESTED"

        if [[ "$EFFECTIVE_PUSH" == "true" ]] &&
          [[ "$IS_PULL_REQUEST" == "true" ]] &&
          [[ "$PUSH_ON_PR" != "true" ]]; then
          echo "::warning::Push disabled on pull request events. Set push_on_pr=true to override."
          EFFECTIVE_PUSH="false"
        fi

        echo "Registry:        $REGISTRY"
        echo "Base name:       $BASE_NAME"
        echo "Suffix:          ${SUFFIX:-<none>}"
        echo "Image name:      $IMAGE_NAME"
        echo "Image repo:      $IMAGE_REPOSITORY"
        echo "Branch / event:  $BRANCH / $EVENT_NAME"
        echo "Build commit:    $BUILD_SHA"
        echo "Version tag:     $VERSION"
        echo "Latest tag:      $LATEST_ENABLED"
        echo "Push enabled:    $EFFECTIVE_PUSH"

        set_output "base_name" "$BASE_NAME"
        set_output "image_name" "$IMAGE_NAME"
        set_output "image_repository" "$IMAGE_REPOSITORY"
        set_output "branch" "$BRANCH"
        set_output "suffix" "$SUFFIX"
        set_output "version" "$VERSION"
        set_output "build_sha" "$BUILD_SHA"
        set_output "latest_enabled" "$LATEST_ENABLED"
        set_output "push" "$EFFECTIVE_PUSH"
        set_output "cache" "$CACHE_ENABLED"
        set_output "no_cache" "$NO_CACHE"
        set_output "gha_cache" "$GHA_CACHE"
        set_output "load_mode" "$LOAD_MODE"

        echo "::endgroup::"

    - name: Validate context
      id: validate
      shell: bash
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        PLATFORMS: ${{ inputs.platforms }}
        LOAD_MODE: ${{ steps.resolve.outputs.load_mode }}
      run: |
        set -euo pipefail

        # SC1091: the path is only known at run time, shellcheck cannot follow it.
        # shellcheck source=scripts/lib.sh disable=SC1091
        source "$GITHUB_ACTION_PATH/scripts/lib.sh"

        echo "::group::Validating build context"

        if [[ ! -d "$INPUT_CONTEXT" ]]; then
          echo "::error::Build context '$INPUT_CONTEXT' does not exist"
          exit 1
        fi

        if [[ -f "$INPUT_CONTEXT/$INPUT_DOCKERFILE" ]]; then
          DOCKERFILE_PATH="$INPUT_CONTEXT/$INPUT_DOCKERFILE"
        elif [[ -f "$INPUT_DOCKERFILE" ]]; then
          DOCKERFILE_PATH="$INPUT_DOCKERFILE"
        else
          echo "::error::Dockerfile not found at '$INPUT_DOCKERFILE' or '$INPUT_CONTEXT/$INPUT_DOCKERFILE'"
          exit 1
        fi

        PLATFORM_LIST=""
        while IFS= read -r platform; do
          platform="$(trim "$platform")"
          if [[ -z "$platform" ]]; then
            continue
          fi
          if [[ -n "$PLATFORM_LIST" ]]; then
            PLATFORM_LIST="${PLATFORM_LIST}"$'\n'
          fi
          PLATFORM_LIST="${PLATFORM_LIST}${platform}"
        done <<<"$(printf '%s' "$PLATFORMS" | tr ',' '\n')"

        PLATFORM_COUNT=0
        if [[ -n "$PLATFORM_LIST" ]]; then
          PLATFORM_COUNT="$(printf '%s\n' "$PLATFORM_LIST" | grep -c '' || true)"
        fi

        if [[ "$PLATFORM_COUNT" -eq 0 ]]; then
          echo "::error::Input platforms is empty"
          exit 1
        fi

        MULTI_PLATFORM="false"
        if [[ "$PLATFORM_COUNT" -gt 1 ]]; then
          MULTI_PLATFORM="true"
        fi

        # The only genuinely impossible combination: the local Docker image
        # store has no representation for a multi-platform image, so buildx
        # cannot load one. A build that is not pushed needs no local image at
        # all, so this is refused only when the caller asked for the load
        # explicitly, and the message names the load, not the push.
        if [[ "$MULTI_PLATFORM" == "true" && "$LOAD_MODE" == "true" ]]; then
          echo "::error::load=true cannot be combined with more than one platform: the local Docker image store cannot hold a multi-platform image. Drop load=true, or build a single platform."
          exit 1
        fi

        echo "Context:         $INPUT_CONTEXT"
        echo "Dockerfile:      $DOCKERFILE_PATH"
        echo "Platforms:       $PLATFORMS"
        echo "Multi-platform:  $MULTI_PLATFORM"

        set_output "dockerfile_path" "$DOCKERFILE_PATH"
        set_output "multi_platform" "$MULTI_PLATFORM"
        set_output "platform_list" "$PLATFORM_LIST"

        echo "::endgroup::"

    - name: Set up QEMU
      if: inputs.setup_qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: ${{ inputs.platforms }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Verify builder platforms
      id: builder
      shell: bash
      env:
        BUILDER: ${{ steps.buildx.outputs.name }}
        PLATFORM_LIST: ${{ steps.validate.outputs.platform_list }}
        SETUP_QEMU: ${{ inputs.setup_qemu }}
      run: |
        set -euo pipefail

        echo "::group::Verifying builder platforms"

        if [[ -z "$BUILDER" ]]; then
          echo "::error::Buildx setup did not report a builder name"
          exit 1
        fi

        HOST_ARCH="$(uname -m)"
        echo "Builder:         $BUILDER"
        echo "Host arch:       $HOST_ARCH"

        if ! INSPECT="$(docker buildx --builder "$BUILDER" inspect --bootstrap 2>&1)"; then
          printf '%s\n' "$INSPECT"
          echo "::error::Could not bootstrap the buildx builder '$BUILDER'. The output above is what buildx reported."
          exit 1
        fi

        AVAILABLE="$(printf '%s\n' "$INSPECT" |
          sed -n 's/^[[:space:]]*Platforms:[[:space:]]*//p' |
          tr -d ' ' | tr ',' '\n' | sed '/^$/d' | sort -u)"

        if [[ -z "$AVAILABLE" ]]; then
          echo "::warning::Could not read the platform list from 'docker buildx inspect', skipping the emulation check."
          echo "::endgroup::"
          exit 0
        fi

        echo "Builder platforms: $(printf '%s' "$AVAILABLE" | tr '\n' ' ')"

        MISSING=""
        while IFS= read -r wanted; do
          if [[ -z "$wanted" ]]; then
            continue
          fi
          # A builder advertises linux/arm64 and linux/arm/v7, so accept both an
          # exact match and a more specific variant of the requested platform.
          if ! printf '%s\n' "$AVAILABLE" | grep -qx -F -- "$wanted" &&
            ! printf '%s\n' "$AVAILABLE" | grep -q -F -- "${wanted}/"; then
            MISSING="${MISSING}${wanted} "
          fi
        done <<<"$PLATFORM_LIST"

        # Building for a foreign architecture needs QEMU binfmt handlers
        # registered on the host. Without them the build dies deep inside the
        # first RUN with a bare 'exec format error', so fail here with the real
        # cause instead. This action does not register binfmt behind the
        # caller's back: on a self-hosted runner shared between repositories
        # that is host-wide state every other job sees, so it is opt-in.
        if [[ -n "$MISSING" ]]; then
          echo "::error::This builder cannot build for: ${MISSING% }. The runner is $HOST_ARCH and emulation for those platforms is not registered on it. Either register binfmt once on the host with 'docker run --privileged --rm tonistiigi/binfmt --install all', or pass setup_qemu: \"true\" to let this action register it for the job, which changes host-wide state shared with other jobs. Current setup_qemu=$SETUP_QEMU."
          exit 1
        fi

        echo "::endgroup::"

    - name: Login to registry
      if: steps.resolve.outputs.push == 'true'
      shell: bash
      env:
        REG_USER: ${{ inputs.username }}
        REG_PASS: ${{ inputs.password }}
        REG_HOST: ${{ inputs.registry }}
      run: |
        set -euo pipefail

        echo "::group::Authenticating to $REG_HOST"

        if [[ -z "$REG_USER" ]]; then
          echo "::error::Registry username is empty. Pass a value in the 'username' input."
          exit 1
        fi

        if [[ -z "$REG_PASS" ]]; then
          echo "::error::Registry password is empty. Pass a token in the 'password' input. The default is github.token, so an empty value means the workflow overrode 'password' with an expression that resolved to nothing, for example a secret that is not set."
          exit 1
        fi

        # The credential lands in $DOCKER_CONFIG/config.json, the directory this
        # run created for itself in the prepare step, not in the shared
        # ~/.docker that every concurrent job can read.
        echo "$REG_PASS" | docker login "$REG_HOST" --username "$REG_USER" --password-stdin

        echo "::endgroup::"

    # The runner hands the address of the GitHub Actions cache service, and the
    # job token for it, to JavaScript actions only: the shell steps of a
    # composite action never see them, which is why every build used to run
    # cold. This step reads them and passes them to the build step as step
    # outputs, so they reach that one step and never enter the job environment.
    # It prints variable names only, never a value.
    - name: Read the Actions cache service address
      id: runtime
      if: steps.resolve.outputs.gha_cache == 'true'
      # A cache problem never fails a build. If this step fails, the build step
      # finds no address, says so in a notice and builds cold.
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const variables = {
            token: 'ACTIONS_RUNTIME_TOKEN',
            results_url: 'ACTIONS_RESULTS_URL',
            cache_url: 'ACTIONS_CACHE_URL',
            service_v2: 'ACTIONS_CACHE_SERVICE_V2',
            cache_mode: 'ACTIONS_CACHE_MODE',
          };
          const provided = [];
          for (const [output, name] of Object.entries(variables)) {
            const value = process.env[name] ?? '';
            core.setOutput(output, value);
            if (value !== '') {
              provided.push(name);
            }
          }
          core.info(`Provided by the runner: ${provided.length > 0 ? provided.join(', ') : 'none'}`);

    - name: Build and push
      id: build
      shell: bash
      env:
        BUILDER: ${{ steps.buildx.outputs.name }}
        IMAGE_REPOSITORY: ${{ steps.resolve.outputs.image_repository }}
        IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
        VERSION: ${{ steps.resolve.outputs.version }}
        LATEST_ENABLED: ${{ steps.resolve.outputs.latest_enabled }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ steps.resolve.outputs.build_sha }}
        DOCKERFILE_PATH: ${{ steps.validate.outputs.dockerfile_path }}
        MULTI_PLATFORM: ${{ steps.validate.outputs.multi_platform }}
        BUILD_CONTEXT: ${{ inputs.context }}
        BUILD_ARGS: ${{ inputs.build_args }}
        BUILD_TARGET: ${{ inputs.target }}
        PLATFORMS: ${{ inputs.platforms }}
        PUSH: ${{ steps.resolve.outputs.push }}
        CACHE: ${{ steps.resolve.outputs.cache }}
        NO_CACHE: ${{ steps.resolve.outputs.no_cache }}
        LOAD_MODE: ${{ steps.resolve.outputs.load_mode }}
        LABELS: ${{ inputs.labels }}
        ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        # From the 'runtime' step, empty when it was skipped or failed. The
        # token is masked by the runner, which registers it as a secret.
        ACTIONS_RUNTIME_TOKEN: ${{ steps.runtime.outputs.token }}
        ACTIONS_RESULTS_URL: ${{ steps.runtime.outputs.results_url }}
        ACTIONS_CACHE_URL: ${{ steps.runtime.outputs.cache_url }}
        ACTIONS_CACHE_SERVICE_V2: ${{ steps.runtime.outputs.service_v2 }}
        ACTIONS_CACHE_MODE: ${{ steps.runtime.outputs.cache_mode }}
      run: |
        set -euo pipefail

        # SC1091: the path is only known at run time, shellcheck cannot follow it.
        # shellcheck source=scripts/lib.sh disable=SC1091
        source "$GITHUB_ACTION_PATH/scripts/lib.sh"

        echo "::group::Building $IMAGE_REPOSITORY:$VERSION"

        BUILD_START="$(date +%s)"
        BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        FULL_IMAGE="${IMAGE_REPOSITORY}:${VERSION}"

        # 'auto' reproduces the historical behaviour: load only when the image is
        # not pushed and there is a single platform to load.
        LOAD="false"
        case "$LOAD_MODE" in
          true)
            LOAD="true"
            ;;
          false)
            LOAD="false"
            ;;
          *)
            if [[ "$PUSH" != "true" && "$MULTI_PLATFORM" != "true" ]]; then
              LOAD="true"
            fi
            ;;
        esac

        TAGS=("$FULL_IMAGE")

        if [[ "$LATEST_ENABLED" == "true" ]]; then
          if [[ "$LOAD" == "true" ]]; then
            # ':latest' is a fixed name in a Docker daemon shared with every
            # other job on this runner, so loading it would overwrite an alias
            # another job may be using. A local build keeps the version tag only.
            echo "::notice::Not applying the ':latest' alias to a local build, it would overwrite that tag in the shared Docker daemon. It is still published on pushed builds."
          else
            TAGS+=("${IMAGE_REPOSITORY}:latest")
          fi
        fi

        if [[ "$REF_TYPE" == "tag" ]]; then
          TAGS+=("${IMAGE_REPOSITORY}:$(sanitize_tag "$REF_NAME")")
        fi

        if [[ -n "$ADDITIONAL_TAGS" ]]; then
          IFS=',' read -r -a EXTRA_TAGS <<<"$ADDITIONAL_TAGS"
          for extra in ${EXTRA_TAGS[@]+"${EXTRA_TAGS[@]}"}; do
            extra="$(trim "$extra")"
            if [[ -z "$extra" ]]; then
              continue
            fi
            TAGS+=("${IMAGE_REPOSITORY}:$(sanitize_tag "$extra")")
          done
        fi

        # Always name the builder. Without --builder, buildx reads the global
        # current-builder marker, which on a self-hosted runner is shared state:
        # another job's setup-buildx-action moves it, this build then runs inside
        # that job's buildkit container, and dies when its post step removes it.
        BUILD_CMD=(
          docker buildx build
          --builder "$BUILDER"
          --platform "$PLATFORMS"
          --file "$DOCKERFILE_PATH"
        )

        for tag in "${TAGS[@]}"; do
          BUILD_CMD+=(--tag "$tag")
          echo "Tag: $tag"
        done

        # Build args are passed by key only. '--build-arg KEY=VALUE' puts the
        # value in argv, where any other job on the runner can read it with ps;
        # '--build-arg KEY' makes buildx take the value from the environment.
        if [[ -n "$BUILD_ARGS" ]]; then
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(trim "$line")"
            if [[ -z "$line" || "$line" == "#"* ]]; then
              continue
            fi
            if [[ "$line" != *"="* ]]; then
              echo "::error::build_args entry '$line' is not KEY=VALUE"
              exit 1
            fi
            arg_key="$(trim "${line%%=*}")"
            arg_value="${line#*=}"
            if [[ ! "$arg_key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::build_args key '$arg_key' is not a valid environment variable name"
              exit 1
            fi
            export "${arg_key}=${arg_value}"
            BUILD_CMD+=(--build-arg "$arg_key")
          done <<<"$BUILD_ARGS"
        fi

        if [[ -n "$LABELS" ]]; then
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(trim "$line")"
            if [[ -z "$line" ]]; then
              continue
            fi
            BUILD_CMD+=(--label "$line")
          done <<<"$LABELS"
        else
          BUILD_CMD+=(
            --label "org.opencontainers.image.source=${SERVER_URL}/${REPO}"
            --label "org.opencontainers.image.revision=${SHA}"
            --label "org.opencontainers.image.created=${BUILD_TIME}"
            --label "org.opencontainers.image.version=${VERSION}"
          )
        fi

        if [[ -n "$BUILD_TARGET" ]]; then
          BUILD_CMD+=(--target "$BUILD_TARGET")
        fi

        # Real cache import and export, through the GitHub Actions cache
        # service. The runner hands its address and the job token to JavaScript
        # actions only, so the 'runtime' step reads them and they arrive here
        # as step outputs: in this step's environment and nowhere else.
        #
        # An empty value means 'not provided'. Unset it, because buildx tells an
        # empty variable apart from a missing one.
        for runtime_var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL ACTIONS_CACHE_SERVICE_V2 ACTIONS_CACHE_MODE; do
          if [[ -z "${!runtime_var:-}" ]]; then
            unset "$runtime_var"
          fi
        done

        if [[ "$NO_CACHE" == "true" ]]; then
          BUILD_CMD+=(--no-cache)
          echo "Cache:           disabled by no_cache=true"
        elif [[ "$CACHE" != "true" ]]; then
          echo "Cache:           disabled by cache=false"
        else
          CACHE_SCOPE="$(printf '%s' "$IMAGE_NAME" | tr '/' '-')"

          # Where the cache service is and which protocol it speaks, as cache
          # attributes. The token is not among them: buildx reads it from
          # ACTIONS_RUNTIME_TOKEN in its own environment, never from argv.
          GHA_ENDPOINT=""
          if [[ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            GHA_ENDPOINT="$(gha_cache_endpoint "${ACTIONS_RESULTS_URL:-}" "${ACTIONS_CACHE_URL:-}" "${ACTIONS_CACHE_SERVICE_V2:-}")"
          fi

          # The cache-mode of the job, which the cache service enforces anyway:
          # read imports only, write-only exports only, none turns the cache off.
          # Unset or unknown means both, as in the actions/cache toolkit.
          CACHE_MODE="$(normalize "${ACTIONS_CACHE_MODE:-}")"

          if [[ -z "$GHA_ENDPOINT" ]]; then
            echo "::notice::Build cache is unavailable: the runner did not provide the GitHub Actions cache service to this action (ACTIONS_RUNTIME_TOKEN together with ACTIONS_RESULTS_URL or ACTIONS_CACHE_URL), so the build runs cold. This happens where there is no cache service, for example GitHub Enterprise Server with the Actions cache turned off or a local runner such as act, or when the step that reads these variables failed. See 'Build cache' in the README of relybytes/actions-docker-build-push."
            echo "Cache:           unavailable, building cold"
          elif [[ "$CACHE_MODE" == "none" ]]; then
            echo "Cache:           disabled by cache-mode none"
          else
            CACHE_NOTE=""
            if [[ "$CACHE_MODE" == "write-only" ]]; then
              CACHE_NOTE=", export only (cache-mode write-only)"
            else
              BUILD_CMD+=(--cache-from "type=gha,scope=${CACHE_SCOPE},${GHA_ENDPOINT}")
            fi
            if [[ "$CACHE_MODE" == "read" ]]; then
              CACHE_NOTE=", import only (cache-mode read)"
            else
              # ignore-error keeps a cache export failure from failing the build.
              BUILD_CMD+=(--cache-to "type=gha,mode=max,ignore-error=true,scope=${CACHE_SCOPE},${GHA_ENDPOINT}")
            fi
            echo "Cache:           GitHub Actions cache, scope ${CACHE_SCOPE}${CACHE_NOTE}"
            echo "Cache service:   ${GHA_ENDPOINT}"
          fi
        fi

        if [[ "$PUSH" == "true" ]]; then
          BUILD_CMD+=(--push)
        elif [[ "$LOAD" == "true" ]]; then
          BUILD_CMD+=(--load)
        else
          # No exporter at all. The build still fails on a broken Dockerfile,
          # which is the whole point of a validation build, and this is what
          # makes a multi-platform build possible without pushing.
          echo "Output:          none, validation build only"
        fi

        BUILD_CMD+=("$BUILD_CONTEXT")

        "${BUILD_CMD[@]}"

        BUILD_END="$(date +%s)"
        BUILD_DURATION=$((BUILD_END - BUILD_START))

        echo "Build completed in ${BUILD_DURATION}s"

        DIGEST=""
        if [[ "$PUSH" == "true" ]]; then
          # Report why the digest is missing instead of swallowing every auth,
          # network and registry error into a bland 'Digest: unavailable'.
          if INSPECT_OUTPUT="$(docker buildx --builder "$BUILDER" imagetools inspect "$FULL_IMAGE" --format '{{json .Manifest.Digest}}' 2>&1)"; then
            DIGEST="$(printf '%s' "$INSPECT_OUTPUT" | tr -d '"' | tr -d '\n')"
            echo "Digest: $DIGEST"
          else
            printf '%s\n' "$INSPECT_OUTPUT"
            echo "::warning::Could not read the digest of $FULL_IMAGE. The output above is what 'docker buildx imagetools inspect' reported. The image was pushed, only the 'digest' output is empty."
          fi
        fi

        set_output "image" "$FULL_IMAGE"
        set_output "tags" "$(printf '%s\n' "${TAGS[@]}")"
        set_output "digest" "$DIGEST"
        set_output "build_time" "$BUILD_TIME"

        echo "::endgroup::"

    - name: Cleanup
      id: cleanup
      if: always()
      shell: bash
      env:
        BUILDER: ${{ steps.buildx.outputs.name }}
        CONFIG_DIR: ${{ steps.prepare.outputs.docker_config }}
        CONFIG_DIR_PREVIOUS: ${{ steps.prepare.outputs.docker_config_previous }}
      run: |
        set -uo pipefail

        echo "::group::Cleanup"

        # No global 'docker logout' here. The old one had no condition, so a
        # build that never logged in still rewrote the shared
        # ~/.docker/config.json and could delete the credential another
        # repository's job was using mid-push. Removing this run's own
        # DOCKER_CONFIG directory takes the credential off disk and touches
        # nothing shared.
        if [[ -n "$CONFIG_DIR" && -d "$CONFIG_DIR" ]]; then
          # Remove the builder first: it is registered inside the directory
          # about to be deleted, so tearing it down afterwards would leave a
          # stray buildkit container running on the host.
          if [[ -n "$BUILDER" ]]; then
            docker buildx --builder "$BUILDER" rm --force >/dev/null 2>&1 || true
          fi

          rm -rf -- "$CONFIG_DIR"
          echo "Removed the Docker configuration directory of this run"
        fi

        # Restore whatever DOCKER_CONFIG the job had before, so later steps in
        # the caller's job do not point at a directory that no longer exists.
        # An empty value makes the Docker CLI fall back to its own default.
        echo "DOCKER_CONFIG=$CONFIG_DIR_PREVIOUS" >>"$GITHUB_ENV"

        echo "::endgroup::"
